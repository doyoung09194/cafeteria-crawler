name: Menu Crawler

on:
  schedule:
    - cron: '17 20 * * *'   # 한국 시간 05:17
    - cron: '47 20 * * *'   # 한국 시간 05:47
    - cron: '17 21 * * *'   # 한국 시간 06:17
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyrebase4 pytz

      - name: Run menu crawler
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
        run: python menu_crawler.py
