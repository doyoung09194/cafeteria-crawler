name: Menu Crawler

on:
  schedule:
    - cron: '17 20 * * *'   # KST 05:17
    - cron: '17 21 * * *'   # KST 06:17
    - cron: '17 23 * * *'   # KST 08:17
    - cron: '17 1 * * *'    # KST 10:17
  workflow_dispatch:
    inputs:
      from_date:
        description: '지운 메뉴를 되살릴 시작 날짜 (예: 2026-11-02). 비우면 오늘부터'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pytz

      - name: Run menu crawler
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
          MENU_FROM: ${{ github.event.inputs.from_date }}
        run: python menu_crawler.py
